[package]
name = "slurm-gpu-reporter"
version = "0.1.1"
edition = "2021"
authors = ["Joe Shamblin <wjs@cs.duke.edu>"]
description = "GPU utilization reporting for Slurm"

[[bin]]
name = "slurm-gpu"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
regex = "1"
once_cell = "1"
comfy-table = ">=7.1, <7.2"
chrono = { version = "0.4", features = ["serde"] }
users = "0.11"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
pretty_assertions = "1"
